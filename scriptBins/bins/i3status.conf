# Mirror of i3status's compiled-in default config (the same modules the bar
# showed before) but with output_format forced to i3bar, so i3status emits
# COLORED JSON blocks. The wt-cgroup-i3status wrapper passes those blocks
# through untouched and prepends the worktree block. Without this, i3status
# run behind the wrapper's pipe auto-detects "not i3bar" and drops to
# uncoloured plain text.
#
# Mirrored from i3status 2.14's defaults. There is no drift detection: an
# i3status upgrade that changes its built-in defaults leaves this file
# happily stale, which only matters if you WANT the new defaults -- diff
# against upstream's i3status.conf when bumping past 2.14.
general {
        colors = true
        interval = 5
        output_format = "i3bar"
}

order += "ipv6"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "cpu_usage"
order += "load"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "W: (%quality at %essid) %ip"
        format_down = "W: down"
}

ethernet _first_ {
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

battery all {
        format = "%status %percentage %remaining"
}

disk "/" {
        format = "%avail"
}

cpu_usage {
        format = "CPU %usage"
        degraded_threshold = 60
        max_threshold = 85
}

load {
        format = "%1min"
}

memory {
        format = "%used | %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}
