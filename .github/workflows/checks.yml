# The off-machine copy of the pre-push gate. Every invariant this repo
# enforces (lints, tripwires, formatting, deterministic suites) used to live
# solely in hooks/pre-push -- machine-local, --no-verify-bypassable, and only
# wired after a first successful switch. CI is the version that cannot be
# skipped and works on a fresh clone.
#
# `toplevel` (the full NixOS closure) is deliberately excluded, same as in
# pre-push: it needs unfree packages and gigabytes of downloads, and the
# cheap checks are the ones that gate correctness. The check list is derived
# from the flake, never hardcoded (the "new suite silently never runs" trap).
name: checks
on:
  push:
    branches: [master]
  pull_request:
jobs:
  flake-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Run flake checks (all but toplevel)
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            nix eval .#checks.x86_64-linux --raw \
              --apply 'c: builtins.concatStringsSep "\n" (builtins.filter (n: n != "toplevel") (builtins.attrNames c))'
          )
          echo "checks: ${checks[*]}"
          for c in "${checks[@]}"; do
            nix build --no-link -L ".#checks.x86_64-linux.$c"
          done
